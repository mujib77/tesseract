<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tesseract — Execution Chamber</title>
  <style>
    body { margin: 0; overflow: hidden; background: #020407; }
    canvas { display: block; }

    #hud {
      
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      color: #bffcff;
      font: 14px monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 12px #00e5ff;
    }

    #title {
      color: #ffffff;
      font-size: 20px;
      margin-bottom: 10px;
    }

    #result {
      color: #74ff9b;
      margin-top: 8px;
    }

    #program {
  color: #d9b8ff;
  margin-bottom: 8px;
  max-width: 680px;
  letter-spacing: 0.03em;
  text-transform: none;
}

    #control {
  color: #ffca68;
  margin-top: 8px;
  }

    button {
      margin-top: 14px;
      padding: 9px 14px;
      background: #00d9ff;
      color: #001014;
      border: 0;
      font: bold 12px monospace;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">TESSERACT / EXECUTION CHAMBER</div>
    <div id="program">Awaiting compiler…</div>
    <div id="input">Loading optical program…</div>
    <div id="result"></div>
    <div id="control"></div>
    <button id="replay">REPLAY LIGHT</button>
    <button id="cinematic">CINEMATIC RUN</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module" src="chamber.js"></script>
</body>
</html>
